name: Movie Court checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: court_test
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: court_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U court_test -d court_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: SQLite tests
        run: python -m pytest -q
      - name: PostgreSQL tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://court_test:local_ci_password@localhost:5432/court_test
        run: python -m pytest -q
      - name: Build application image
        run: docker build -t movie-court:ci .
